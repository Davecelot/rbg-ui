<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBG — simulador de host</title>
    <style>
      .host {
        margin: 0;
        min-height: 100vh;
        background-color: #6c8a7a;
        background-image:
          linear-gradient(45deg, #5f7d6d 25%, transparent 25%, transparent 75%, #5f7d6d 75%),
          linear-gradient(45deg, #5f7d6d 25%, transparent 25%, transparent 75%, #5f7d6d 75%);
        background-position:
          0 0,
          16px 16px;
        background-size: 32px 32px;
        font-family: system-ui, sans-serif;
      }
      .host__launcher {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 8px 16px;
        font: inherit;
      }
    </style>
  </head>
  <body class="host">
    <button type="button" class="host__launcher" data-host-launcher hidden>Abrir RBG</button>
    <div id="rbg" class="rbg" lang="pt-BR"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
